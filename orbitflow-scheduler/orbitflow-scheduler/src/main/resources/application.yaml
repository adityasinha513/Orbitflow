server:
  port: 8082

spring:
  application:
    name: orbitflow-scheduler

  datasource:
    url: jdbc:postgresql://localhost:5432/orbitflow
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # orbitflow-api owns schema creation/migration; this service only reads/writes existing tables.
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: orbitflow-scheduler
      auto-offset-reset: earliest
      # Scheduler now listens to two differently-shaped topics (step.completed, step.dlq).
      # Rather than juggling a typed JsonDeserializer per topic, consume raw JSON and pull out
      # just the runId field each listener actually needs - see StepOutcomeConsumer.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

orbitflow:
  scheduler:
    poll-interval-ms: 2000