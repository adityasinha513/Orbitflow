server:
  port: 8081

spring:
  application:
    name: orbitflow-api

  datasource:
    url: jdbc:postgresql://localhost:5432/orbitflow
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true